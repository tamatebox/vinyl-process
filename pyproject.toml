[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vinyl-process"
version = "0.1.0"
description = "Transform raw vinyl recordings into processed, tagged digital albums"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["vinyl", "audio", "restoration", "declick", "archival", "flac"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Multimedia :: Sound/Audio :: Editors",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "pydantic>=2.5",
    "click>=8.1",
    "mutagen>=1.47",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
]

[project.scripts]
vinyl-process = "vinyl_process.cli:main"

# Third-party DSP engines register themselves here; see docs/dsp-engines.md.
[project.entry-points."vinyl_process.dsp_engines"]

[tool.hatch.build.targets.wheel]
packages = ["src/vinyl_process"]

# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/vinyl_process"]
branch = true
# __main__ is exercised by tests/e2e/test_module_entrypoint.py in a subprocess,
# which coverage in this process cannot see.
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "pragma: no cover"]

# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "UP",        # pyupgrade
    "B",         # bugbear
    "SIM",       # simplify
    "C4",        # comprehensions
    "PT",        # pytest style
    "PTH",       # prefer pathlib
    "RET",       # return simplifications
    "ARG",       # unused arguments
    "N",         # naming
    "ISC",       # implicit string concat
    "LOG", "G",  # logging correctness
    "TID",       # tidy imports
    "RUF",
]
ignore = [
    "N818",    # exception names: this project's hierarchy reads better without 'Error' suffixes everywhere
    "RUF001",  # ambiguous unicode: '…' is used deliberately in messages
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private registries on purpose to simulate broken plug-ins.
"tests/**" = ["ARG001", "ARG002", "SLF001"]
# The engine base class documents each operation's signature and then refuses it,
# so its arguments are deliberately unused.
"src/vinyl_process/dsp/base.py" = ["ARG002"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# --------------------------------------------------------------------------- #
[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts"]
strict = true
warn_unreachable = true
pretty = true

[[tool.mypy.overrides]]
# soundfile and scipy ship no usable stubs.
module = ["soundfile.*", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# mutagen ships no type information, so every container call reads as untyped.
module = ["vinyl_process.metadata.tagger"]
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# Fixtures, parametrised cases and one-off scripts would need noisy annotations
# for no benefit; everything else about them is still type-checked.
module = ["tests.*", "regenerate_examples"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false
warn_return_any = false
